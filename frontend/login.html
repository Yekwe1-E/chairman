<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - APFMS Poultry Farm System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(145deg, #071e15 0%, #092c1e 40%, #0b132b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(0,0,0,0) 70%);
      top: -200px;
      right: -200px;
      pointer-events: none;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      width: 100%;
      max-width: 450px;
      border-radius: var(--radius-xl);
      padding: 2.5rem 2.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
      z-index: 10;
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header .icon {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.65rem;
      margin: 0 auto 1rem;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper input {
      padding-right: 2.75rem;
    }
    .toggle-pw {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
    }
    .demo-accounts {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.1rem;
      margin-top: 1.75rem;
    }
    .demo-accounts h5 {
      margin-bottom: 0.65rem;
      color: var(--primary-dark);
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .demo-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .demo-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.76rem;
      cursor: pointer;
      font-weight: 700;
      color: var(--text-main);
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .demo-btn:hover {
      background: var(--primary-accent-light);
      color: var(--primary-dark);
      border-color: var(--primary-accent);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="icon"><i class="fa-solid fa-drumstick-bite"></i></div>
      <h2 style="font-size: 1.6rem; color: var(--primary-dark);">Welcome Back</h2>
      <p style="font-size: 0.88rem; color: var(--text-muted); margin-top: 0.2rem;">Sign in to control your poultry farm dashboard</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email"><i class="fa-solid fa-envelope" style="color: var(--primary-accent);"></i> Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="admin@farm.com" required>
      </div>

      <div class="form-group">
        <label for="password"><i class="fa-solid fa-lock" style="color: var(--primary-accent);"></i> Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          <i class="fa-solid fa-eye toggle-pw" id="togglePw"></i>
        </div>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 0.95rem; margin-top: 0.5rem;"><i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard</button>
    </form>

    <div class="demo-accounts">
      <h5><i class="fa-solid fa-wand-magic-sparkles" style="color: var(--primary-accent);"></i> One-Click Demo Role Accounts:</h5>
      <div class="demo-chips">
        <button type="button" class="demo-btn" onclick="fillDemo('admin@farm.com')"><i class="fa-solid fa-user-shield"></i> Admin</button>
        <button type="button" class="demo-btn" onclick="fillDemo('manager@farm.com')"><i class="fa-solid fa-user-gear"></i> Manager</button>
        <button type="button" class="demo-btn" onclick="fillDemo('worker@farm.com')"><i class="fa-solid fa-clipboard-user"></i> Worker</button>
        <button type="button" class="demo-btn" onclick="fillDemo('finance@farm.com')"><i class="fa-solid fa-coins"></i> Finance</button>
      </div>
    </div>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
      Need a new farm account? <a href="register.html" style="color: var(--primary-accent); font-weight: 700;">Register here</a>
    </p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    const passwordInput = document.getElementById('password');
    const togglePw = document.getElementById('togglePw');

    togglePw.addEventListener('click', () => {
      const isPw = passwordInput.type === 'password';
      passwordInput.type = isPw ? 'text' : 'password';
      togglePw.className = isPw ? 'fa-solid fa-eye-slash toggle-pw' : 'fa-solid fa-eye toggle-pw';
    });

    function fillDemo(email) {
      document.getElementById('email').value = email;
      passwordInput.value = 'Password123!';
      showToast(`Selected demo credentials for ${email}`, 'success');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = passwordInput.value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const result = await res.json();

        if (result.success) {
          Auth.setSession(result.token, result.user);
          showToast('Authentication successful! Opening control panel...', 'success');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
        } else {
          showToast(result.message || 'Authentication failed.', 'error');
        }
      } catch (err) {
        showToast('Server connection error. Please verify backend is running.', 'error');
      }
    });
  </script>
</body>
</html>
